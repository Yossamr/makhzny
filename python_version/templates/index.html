<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; }
        .autocomplete-items div { padding: 10px; cursor: pointer; background-color: #fff; border-bottom: 1px solid #d4d4d4; }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
        .autocomplete-active { background-color: DodgerBlue !important; color: #ffffff; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">إدخال بيانات تذكرة جديدة</h4>
        </div>
        <div class="card-body">
            <form id="dataForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">الفرع</label>
                        <input type="text" class="form-control" id="branch" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">اسم العيادة</label>
                        <input type="text" class="form-control" id="clinic_name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">تاريخ التذكرة</label>
                        <input type="date" class="form-control" id="ticket_date" required>
                    </div>
                    <div class="col-md-6 position-relative">
                        <label class="form-label">اسم الصنف / الدواء</label>
                        <input type="text" class="form-control" id="drug_name" autocomplete="off" required>
                        <div id="autocomplete-list" class="autocomplete-items"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">الوحدة</label>
                        <select class="form-select" id="unit" required>
                            <option value="">اختر الوحدة</option>
                            <option value="علبة">علبة</option>
                            <option value="شريط">شريط</option>
                            <option value="قرص">قرص</option>
                            <option value="زجاجة">زجاجة</option>
                            <option value="حقنة">حقنة</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">سعر الوحدة</label>
                        <input type="number" step="0.01" class="form-control" id="unit_price" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">الكمية المنصرفة</label>
                        <input type="number" step="0.01" class="form-control" id="quantity" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">الإجمالي</label>
                        <input type="text" class="form-control bg-light" id="total" readonly>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary px-4">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const unitPriceInput = document.getElementById('unit_price');
    const quantityInput = document.getElementById('quantity');
    const totalInput = document.getElementById('total');
    const drugNameInput = document.getElementById('drug_name');
    const autocompleteList = document.getElementById('autocomplete-list');

    // Calculate Total
    function calculateTotal() {
        const price = parseFloat(unitPriceInput.value) || 0;
        const qty = parseFloat(quantityInput.value) || 0;
        totalInput.value = (price * qty).toFixed(2);
    }
    unitPriceInput.addEventListener('input', calculateTotal);
    quantityInput.addEventListener('input', calculateTotal);

    // Autocomplete
    drugNameInput.addEventListener('input', async function() {
        const val = this.value;
        autocompleteList.innerHTML = '';
        if (!val) return false;

        const res = await fetch(`/api/drugs/search?q=${encodeURIComponent(val)}`);
        const drugs = await res.json();

        drugs.forEach(drug => {
            const div = document.createElement('div');
            div.innerHTML = drug;
            div.addEventListener('click', function() {
                drugNameInput.value = drug;
                autocompleteList.innerHTML = '';
            });
            autocompleteList.appendChild(div);
        });
    });

    // Close autocomplete when clicking outside
    document.addEventListener('click', function(e) {
        if (e.target !== drugNameInput) {
            autocompleteList.innerHTML = '';
        }
    });

    // Submit Form
    document.getElementById('dataForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
            branch: document.getElementById('branch').value,
            clinic_name: document.getElementById('clinic_name').value,
            ticket_date: document.getElementById('ticket_date').value,
            drug_name: document.getElementById('drug_name').value,
            unit: document.getElementById('unit').value,
            unit_price: parseFloat(document.getElementById('unit_price').value),
            quantity: parseFloat(document.getElementById('quantity').value),
            total: parseFloat(totalInput.value)
        };

        const res = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert('تم الحفظ بنجاح!');
            document.getElementById('dataForm').reset();
            totalInput.value = '';
        } else {
            alert('حدث خطأ أثناء الحفظ.');
        }
    });
</script>
</body>
</html>
